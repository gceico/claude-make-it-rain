<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Make It Rain overlay</title>
<style>
  @property --burn {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    user-select: none;
  }
  .emoji {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform, opacity, mask, -webkit-mask;
    line-height: 1;
  }
  /* A "money stack": several bills layered with slight offsets/rotation so
     they read as a fanned wad of cash rather than a single 💵. */
  .stack {
    display: block;
  }
  .stack > span {
    position: absolute;
    left: 0;
    top: 0;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25));
  }
  /* Bills always keep their natural green 💵 — spend vs save is conveyed by a
     small corner badge, NOT by recoloring the whole glyph (a full hue-rotate
     read pink/ugly). Keep only a subtle drop-shadow. */
  .variant-spend, .variant-save {
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25));
  }
  /* Small corner badge on a bill/stack: 🔻 for spend (natively red = correct),
     💚 for save (natively green everywhere — no CSS hue-rotate, which only
     worked here and rendered inconsistently across emoji fonts). Badge only. */
  .badge {
    position: absolute;
    right: -0.15em;
    bottom: -0.1em;
    line-height: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
<script>
  let activeCount = 0;
  let idleTimer = null;

  function animationStarted() {
    activeCount++;
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  }

  function animationEnded() {
    activeCount--;
    if (activeCount <= 0) {
      activeCount = 0;
      // Debounce so staggered spawns don't hide the window between emoji.
      idleTimer = setTimeout(() => {
        if (activeCount === 0) window.bridge.overlayIdle();
      }, 500);
    }
  }

  // Animates any element falling from (x,y) by (dx,dy) while rotating, then
  // burning up (bottom-up dissolve with a charred ember glow) in the last
  // ~30% of the animation, then cleans it up. Shared by single emoji and
  // composed money stacks — the mask erodes the whole element uniformly so
  // it works whether `el` is a lone 💵 or a layered `.stack` wad.
  function animateFalling(el, { x, y, dx, dy, rotation, duration }) {
    el.style.transform = `translate(${x}px, ${y}px)`;
    el.style.setProperty('--burn', '0%');
    const maskImage =
      'linear-gradient(to top, transparent var(--burn), rgba(0,0,0,0.15) calc(var(--burn) + 8%), #000 calc(var(--burn) + 20%))';
    el.style.setProperty('-webkit-mask-image', maskImage);
    el.style.setProperty('mask-image', maskImage);
    document.body.appendChild(el);
    animationStarted();

    const keyframes = [
      {
        transform: `translate(${x}px, ${y}px) rotate(0rad)`,
        '--burn': '0%',
        offset: 0,
      },
      {
        transform: `translate(${x + dx}px, ${y + dy}px) rotate(${rotation}rad)`,
        '--burn': '0%',
        filter: 'none',
        offset: 0.7,
      },
      {
        transform: `translate(${x + dx}px, ${y + dy - 6}px) rotate(${rotation}rad) scale(0.96)`,
        '--burn': '120%',
        filter:
          'drop-shadow(0 0 6px rgba(255,120,0,0.85)) drop-shadow(0 2px 4px rgba(120,40,0,0.6)) brightness(0.8) sepia(0.4) saturate(2)',
        offset: 1,
      },
    ];
    const anim = el.animate(keyframes, {
      duration: duration * 1000,
      easing: 'ease-in',
      fill: 'forwards',
    });
    anim.onfinish = () => {
      el.remove();
      animationEnded();
    };
  }

  // Small corner badge span: 🔻 (spend, red) / 💚 (save, green), ~40% bill size.
  function makeBadge(variant, size) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = variant === 'save' ? '💚' : '🔻';
    b.style.fontSize = (size * 0.4) + 'px';
    return b;
  }

  // variant: 'spend' | 'save' — bill is always green 💵; `badge` adds the
  // small corner triangle that signals direction.
  function spawnEmoji({ symbol, size, variant, badge, ...motion }) {
    const el = document.createElement('div');
    el.className = 'emoji ' + (variant === 'save' ? 'variant-save' : 'variant-spend');
    el.style.fontSize = size + 'px';
    const bill = document.createElement('span');
    bill.textContent = symbol;
    el.appendChild(bill);
    if (badge) el.appendChild(makeBadge(variant, size));
    animateFalling(el, motion);
  }

  // How many 💵 layers make up one "money stack" (a $10 milestone = one such
  // stack; $50 = five of them). The payload from main doesn't carry this, so
  // it's a renderer-side default.
  const BILLS_PER_STACK = 10;

  // Builds a layered stack of bills — a richer visual than a lone 💵.
  // With 10 layers the per-layer offset/rotation is much smaller than the old
  // 4-layer fan, so the wad still reads as ONE thick stack and keeps roughly
  // the same overall footprint.
  function makeStack(size, layers = BILLS_PER_STACK, variant) {
    const el = document.createElement('div');
    el.className = 'emoji stack ' + (variant === 'save' ? 'variant-save' : 'variant-spend');
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    for (let i = 0; i < layers; i++) {
      const bill = document.createElement('span');
      bill.textContent = '💵';
      bill.style.fontSize = size + 'px';
      // Fan the bills: stagger upward and tilt each one a touch.
      bill.style.top = (-i * size * 0.055) + 'px';
      bill.style.left = ((i - (layers - 1) / 2) * size * 0.02) + 'px';
      bill.style.transform = `rotate(${(i - (layers - 1) / 2) * 1.5}deg)`;
      el.appendChild(bill);
    }
    return el;
  }

  // `badge` adds the small direction triangle next to the stack (spend/save).
  function spawnStack({ size, billsPerStack, variant, badge, ...motion }) {
    const el = makeStack(size, billsPerStack, variant);
    if (badge) el.appendChild(makeBadge(variant, size * 0.6));
    animateFalling(el, motion);
  }

  const rand = (min, max) => min + Math.random() * (max - min);

  // Dollar-fly: green 💵 dropping from the tray item with a small corner badge
  // (🔻 spend / 💚 save), staggered ~120ms apart.
  function flyBills({ count, anchor, variant }) {
    const capped = Math.max(0, Math.min(count, 10));
    for (let i = 0; i < capped; i++) {
      setTimeout(() => {
        spawnEmoji({
          symbol: '💵',
          variant,
          badge: true,
          size: 28,
          x: anchor.x + anchor.width / 2 - 14 + rand(-6, 6),
          y: anchor.y + anchor.height,
          dx: rand(-60, 60),
          dy: rand(150, 250),
          rotation: rand(-0.6, 0.6),
          duration: 1.8,
        });
      }, i * 120);
    }
  }

  // Milestone reward: `count` thick money stacks bursting from the tray
  // anchor — each one a fanned wad of BILLS_PER_STACK bills (see makeStack),
  // so hitting a milestone feels like a genuine payout rather than a lone 💵.
  // Stacks are staggered so several read as an escalating celebration
  // (count=1 for $10, count=5 for $50; $100 gets the full-screen rain).
  // variant: 'spend' (default, red down-stack) | 'save' (green savings
  // stack — see the $10/$50/$100 down-then-up choreography wired in main.ts).
  function moneyStacks({ count, anchor, variant }) {
    const stacks = Math.max(1, Math.min(count || 1, 5));
    const cx = anchor ? anchor.x + anchor.width / 2 - 24 : window.innerWidth / 2;
    const cy = anchor ? anchor.y + anchor.height : 60;
    for (let s = 0; s < stacks; s++) {
      setTimeout(() => {
        spawnStack({
          size: rand(40, 52),
          variant,
          badge: true,
          x: cx + rand(-30, 30),
          y: cy,
          dx: rand(-160, 160),
          dy: rand(220, 380),
          rotation: rand(-1.2, 1.2),
          duration: rand(1.8, 2.6),
        });
      }, s * 220);
    }
  }

  // ── Coin/shimmer sound (Web Audio, synthesized — no audio files) ────────────
  let muted = false;
  let audioCtx = null;

  function getAudioContext() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    // The overlay window is non-focusable and gets no user gesture, so the
    // context can start (or get) suspended. Resuming here is a defensive
    // complement to the main-process autoplayPolicy override.
    if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    return audioCtx;
  }

  // A single bright, fast-decaying "ting".
  function ting(ctx, when, freq, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(peakGain, when + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.22);
    osc.connect(gain).connect(ctx.destination);
    osc.start(when);
    osc.stop(when + 0.26);
  }

  // A short, quiet cascade of coin tings to accompany the rain.
  function playCoinShimmer() {
    if (muted) return;
    const ctx = getAudioContext();
    if (!ctx) return;
    const NOTES = [1568, 2093, 2637, 3136, 3520]; // sparkly upper-register set
    const start = ctx.currentTime;
    for (let i = 0; i < 7; i++) {
      const freq = NOTES[Math.floor(Math.random() * NOTES.length)] * (0.99 + Math.random() * 0.02);
      ting(ctx, start + i * 0.07 + Math.random() * 0.02, freq, 0.05);
    }
  }

  // $100 celebration: full-screen shower of dollar bills for ~6s. Every bill is
  // the same green 💵 carrying a directional badge — 🔻 for a spend rain, green
  // 💚 for the savings rain — so a $100 milestone reads as "100 dollars gone",
  // and its savings closer as "and here's what came back". No mixed glyphs.
  let raining = false;

  function rain(payload) {
    // If a rain is already showing, let it keep running rather than stacking.
    if (raining) return;
    raining = true;
    setTimeout(() => { raining = false; }, 6000);

    const variant = payload && payload.variant === 'save' ? 'save' : 'spend';

    // With one overlay per display, main tells only the primary display to
    // play the shimmer ({sound: true}) so it isn't layered once per screen.
    // An absent payload keeps the pre-multi-display behaviour: play (still
    // subject to the mute preference inside playCoinShimmer).
    if (payload ? !!payload.sound : true) playCoinShimmer();

    const W = window.innerWidth;
    const H = window.innerHeight;
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const size = rand(20, 48);
        const y = -size * 1.5;
        const motion = {
          x: rand(0, Math.max(1, W - size)),
          y,
          dx: rand(-80, 80),
          // Land the fall just inside the bottom edge — the last ~30% of the
          // animation is the burn, so bills dissolve on-screen near the
          // floor instead of off the bottom of the window.
          dy: (H - y) - rand(size, size * 3),
          rotation: rand(-3, 3),
          duration: rand(2.5, 5),
        };
        // Every raindrop is a badged 💵 — uniform bills, direction via badge.
        spawnEmoji({ symbol: '💵', variant, badge: true, size, ...motion });
      }, rand(0, 1500));
    }
  }

  window.bridge.onFlyBills(flyBills);
  window.bridge.onStack(moneyStacks);
  window.bridge.onRain(rain);
  window.bridge.onSetMuted((m) => { muted = m; });
</script>
</body>
</html>
